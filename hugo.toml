# Bulma is pulled in as a Hugo module (no npm needed).
# Its Sass sources are mounted under assets/mod/bulma and compiled by
# Dart Sass in layouts/partials/head.html.
[module]
  [[module.imports]]
    path = "github.com/jgthms/bulma"
    [[module.imports.mounts]]
      source = "sass"
      target = "assets/mod/bulma/sass"
    [[module.imports.mounts]]
      source = "versions"
      target = "assets/mod/bulma/versions"
