[languages.fr.params]
subtitle = "Gestion Écosystémique & Science des Données en Biodiversité"
keywords = ["Solutions", "Accompagnement", "Formations"]
title_expertise = "Notre expertise"
subtitle_expertise = "Nous sommes d’éminents scientifiques et experts en données spécialisés dans les sciences de la biodiversité. Notre expertise académique couvre l'écologie théorique du réseau trophique et le développement de méthodologies essentielles pour la gestion écosystémique, comme détaillé dans notre longue liste de publications évaluées par des pairs. En tant que data scientists, nous excellons dans un large éventail d’analyses statistiques, en les appliquant à des ensembles de données vastes et diversifiés à l’aide de technologies avancées. Avec plus d'une décennie d'expérience professionnelle et universitaire, nous avons perfectionné nos compétences en aidant les scientifiques universitaires et gouvernementaux à analyser et à visualiser les données sur la biodiversité, et à créer des pipelines analytiques robustes et des outils interactifs."
title_team = "Notre équipe"
subtitle_team = ""
footer = 'Le code source de ce site est disponible sur <a href="https://github.com/inSilecoInc/insilecoinc.github.io">GitHub</a> sous licence <a href="http://opensource.org/licenses/mit-license.php">MIT</a>.</br><i class="fa-solid fa-copyright fa-sm"></i> inSileco Inc. 2020-2026'


