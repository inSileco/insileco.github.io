<div id="approach" class="columns is-multiline is-vcentered is-narrow content mx-6-tablet my-6">
    {{ $appr := index .Site.Data .Site.Language.Lang "home" "approach" }}
    {{ with $appr }}
    <div class="column is-full has-text-centered content-text">
        <h1>{{ .title }}</h1>
    </div>

    <div class="column is-6 is-offset-3">
        <iframe
            data-tally-src="{{ .tally.project_intake_url }}"
            loading="lazy" width="100%" height="733" frameborder="0" marginheight="0" marginwidth="0"
            title="{{ .tally.project_intake_title }}"></iframe>
        <script>var d = document, w = "https://tally.so/widgets/embed.js", v = function () { "undefined" != typeof Tally ? Tally.loadEmbeds() : d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function (e) { e.src = e.dataset.tallySrc })) }; if ("undefined" != typeof Tally) v(); else if (d.querySelector('script[src="' + w + '"]') == null) { var s = d.createElement("script"); s.src = w, s.onload = v, s.onerror = v, d.body.appendChild(s); }</script>

    </div>

    {{ end }}

</div>
