{{ define "main" }}
<section id="get-in-touch" class="section">
    <div class="container content">
        <h1>{{ .Title }}</h1>
        <div class="columns is-centered">
            <div class="column is-8-desktop is-12-tablet">
                {{ if eq .Site.Language.Lang "fr" }}
                <iframe data-tally-src="https://tally.so/embed/zxMg5M?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="861" frameborder="0" marginheight="0" marginwidth="0" title="Blog contact form (FR)"></iframe>
                {{ else }}
                <iframe data-tally-src="https://tally.so/embed/aQ4A8E?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="898" frameborder="0" marginheight="0" marginwidth="0" title="Blog contact form"></iframe>
                {{ end }}
                <script>var d = document, w = "https://tally.so/widgets/embed.js", v = function () { "undefined" != typeof Tally ? Tally.loadEmbeds() : d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function (e) { e.src = e.dataset.tallySrc })); }; if ("undefined" != typeof Tally) v(); else if (d.querySelector('script[src="' + w + '"]') == null) { var s = d.createElement("script"); s.src = w, s.onload = v, s.onerror = v, d.body.appendChild(s); }</script>
            </div>
        </div>
    </div>
</section>
{{ end }}
