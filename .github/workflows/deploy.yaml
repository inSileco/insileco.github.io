name: Build and deploy website
on:
  workflow_dispatch:
  push:
    branches:
    - main
  schedule:
    - cron: '0 7 * * 1-5'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go (needed for Hugo modules)
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Install Dart Sass
      env:
        DART_SASS_VERSION: 1.104.1
      run: |
        curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
        mkdir -p "${HOME}/.local"
        tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
        echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.166.0'
        extended: true

    - name: Build website
      run: hugo --minify

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./public
