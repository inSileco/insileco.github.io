title: Témoignages
subtitle: Nos clients sont nos meilleurs alliés. 
testimonials:
  - name: Élise Filotas
    organization: TÉLUQ
    post: professeure
    text: |
      L'équipe d'inSileco m'a fourni un accompagnement hors pair lors de la création du contenu et de l'édition du cours numérique SCI 1031 Visualisation et analyse de données spatiales sous R, maintenant offert à l'Université TÉLUQ. Que ce soit pour la rédaction de contenu pédagogique, le développement d'exemples originaux, l'utilisation de RMarkdown ou github, j'ai été impressionnée par la qualité et l'efficacité de leur travail.
  - name: Kevin McCann
    organization: University of Guelph
    post: professeur
    text: |
      Je dirais que cette entreprise offre des compétences de tout premier ordre en programmation, en bases de données et en résolution de problèmes complexes. De plus, elle livre efficacement, communique clairement avec vous et votre équipe, et dépasse largement les attentes.
      