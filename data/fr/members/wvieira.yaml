bio:
  short: |
    Willian Vieira est titulaire d’un doctorat en écologie de l’Université de Sherbrooke. Spécialisé en dynamique forestière, en modélisation bayésienne et en science des données environnementales, il combine écologie quantitative et ingénierie des données pour développer des analyses reproductibles et des chaînes de traitement fiables au service de la prise de décision environnementale.
  long: |
    Willian Vieira est écologue quantitatif et scientifique de données, titulaire d’un doctorat en écologie de l’Université de Sherbrooke. Il combine modélisation bayésienne, analyse spatiale et ingénierie des données pour étudier la dynamique forestière et soutenir la prise de décision environnementale. Son parcours couvre la recherche universitaire, le suivi des oiseaux boréaux avec Environnement et Changement climatique Canada et la consultation environnementale chez Habitat. Il développe des outils analytiques et des chaînes de traitement reproductibles qui rendent les données environnementales traçables, fiables et réutilisables. Il a également enseigné les statistiques, la programmation scientifique et les pratiques de recherche reproductible.
