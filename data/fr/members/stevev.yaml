bio:
  short: |
    Steve Vissault est titulaire d'une maîtrise de l'Université du Québec à Rimouski où il s'est concentré sur la dynamique forestière dans le contexte des changements climatiques et a développé de solides compétences quantitatives et informatiques. Depuis, il a travaillé comme scientifique des données principal dans les domaines environnemental et médical.
  long: |
    Vincent Bellavance est titulaire d’une maîtrise de l’Université de Sherbrooke. Spécialisé en programmation scientifique et en gestion des données, il se consacre à l’organisation, à la structuration et à la diffusion des données issues de travaux de laboratoire. Son expertise porte notamment sur la modélisation spatiale et les modèles de répartition des espèces, appliqués en particulier à l’écologie benthique. Il développe également des applications web interactives visant à faciliter la visualisation et l’interprétation des résultats de la recherche.