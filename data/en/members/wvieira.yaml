bio:
  short: |
    Willian Vieira holds a PhD in ecology from Université de Sherbrooke. He specializes in forest dynamics, Bayesian modeling, and environmental data science, combining quantitative ecology with data engineering to develop reproducible analyses and reliable data workflows for environmental decision-making.
  long: |
    Willian Vieira is a quantitative ecologist and data scientist with a PhD in ecology from Université de Sherbrooke. He combines Bayesian modeling, spatial analysis, and data engineering to study forest dynamics and support environmental decision-making. His experience spans academic research, boreal bird monitoring with Environment and Climate Change Canada, and environmental consulting at Habitat. He develops reproducible workflows and analytical tools that make complex environmental data traceable, reliable, and reusable, and has taught statistics, scientific programming, and reproducible research practices.
