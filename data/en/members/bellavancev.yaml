  long: |
    Vincent Bellavance holds a master’s degree from the Université de Sherbrooke. Specializing in scientific programming and data management, he focuses on organizing, structuring, and disseminating laboratory data. His expertise includes spatial modeling and species distribution models, particularly applied to benthic ecology. He also develops interactive web applications to support the visualization and interpretation of research results.